name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OMAMUSIC_ACOUSTID_KEY: 4dYTkZ5T3E

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang ffmpeg \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: jdx/mr-boxington-action@v1

      - name: Clippy
        run: mbx clippy --all-targets -- -D warnings

      - name: Build
        run: mbx build --all-targets

      - name: Test
        run: mbx test
        env:
          RENDERING_REQUIRED: "1"

  flatpak:
    name: Flatpak build
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME Platform and SDK 48
        run: |
          flatpak install -y --user flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - name: Build flatpak bundle
        run: ./flatpak/build.sh

      - name: Verify bundle produced
        run: test -f io.github.omafellas.omamusic.flatpak
